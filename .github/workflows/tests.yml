# Fast checks on every push and pull request: unit and interface tests (about a minute).
# The accuracy tests download sample books and OCR models and take several minutes;
# run them locally with `pytest -m accuracy`.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1
      - name: Install
        run: pip install -e ".[gui,test]"
      - name: Unit and interface tests
        run: pytest -m "not accuracy"
        env:
          QT_QPA_PLATFORM: offscreen
